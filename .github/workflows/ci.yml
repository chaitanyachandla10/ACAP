name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: API smoke test
        run: |
          npm run start:api &
          API_PID=$!
          trap "kill $API_PID" EXIT
          for attempt in {1..20}; do
            curl --fail http://localhost:3000/api/health && exit 0
            sleep 1
          done
          exit 1
