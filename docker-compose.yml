services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: acap
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - acap_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d acap"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@database:5432/acap
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      database:
        condition: service_healthy

volumes:
  acap_data:
